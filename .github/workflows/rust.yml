name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Clean-room spec lint
        run: cargo run -q -p xtask -- spec-lint spec/rekordbox

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reference fixtures
        shell: bash
        run: |
          python tools/reference/test_export_rekordbox_anlz.py
          python tools/reference/make_synthetic.py
          test -z "$(git status --porcelain -- tests/reference/synthetic)"
