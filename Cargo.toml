[workspace]
members = [
    "vilelabox-types",
    "vilelabox-reference",
    "vilelabox-anlz",
    "vilelabox-xml",
    "vilelabox-catalog",
    "vilelabox-storage",
    "vilelabox-library",
    "vilelabox-core",
    "vilelabox-cli",
    "vilelabox-audio",
    "xtask",
    "vilelabox-app",
]
resolver = "2"

# Dependencias (symphonia, slint) otimizadas mesmo no modo dev.
[profile.dev.package."*"]
opt-level = 3
