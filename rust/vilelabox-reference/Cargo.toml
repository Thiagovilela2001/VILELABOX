[package]
name = "vilelabox-reference"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-or-later"
description = "Schema canônico de referência, normalizador e comparador diferencial com tolerâncias do VILELABOX"

[dependencies]
vilelabox-types = { path = "../vilelabox-types" }
serde = { version = "1.0", features = ["derive"] }
