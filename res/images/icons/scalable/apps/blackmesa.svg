<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- blackmesa (mod de compassos do Mixxx): pé de cabra sobre 4 tempos,
       o tempo 1 em laranja. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20242a"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="0.5" stop-color="#d81e14"/>
      <stop offset="1" stop-color="#8e0f0a"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2f343c"/>

  <!-- 4 tempos ao fundo -->
  <g opacity="0.9">
    <rect x="40" y="204" width="34" height="8" rx="4" fill="#ff8c1a"/>
    <rect x="86" y="204" width="34" height="8" rx="4" fill="#3a4049"/>
    <rect x="132" y="204" width="34" height="8" rx="4" fill="#3a4049"/>
    <rect x="178" y="204" width="34" height="8" rx="4" fill="#3a4049"/>
  </g>

  <!-- pé de cabra, na diagonal -->
  <g transform="translate(132 108) rotate(-45)" stroke-linejoin="round">
    <g transform="translate(5 6)" opacity="0.5">
      <path d="M-96 10 L-84 0 L52 0 A21 21 0 0 0 52 -42 L34 -42" fill="none" stroke="#000" stroke-width="16"/>
    </g>
    <!-- haste, curva e garra -->
    <path d="M-84 0 L52 0 A21 21 0 0 0 52 -42 L40 -42" fill="none" stroke="#c41a10" stroke-width="15"/>
    <!-- garra afinando, com fenda -->
    <path d="M40 -49.5 L24 -44.5 L24 -39.5 L40 -34.5 Z" fill="#c41a10"/>
    <path d="M42 -42 L25 -42" stroke="#16191d" stroke-width="2.5"/>
    <!-- brilho -->
    <path d="M-80 -4 L52 -4 A17 17 0 0 0 66 -30" fill="none" stroke="#ff6a4a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <!-- ponta chata dobrada, em aço -->
    <path d="M-84 0 L-96 10" fill="none" stroke="#c41a10" stroke-width="15"/>
    <path d="M-93 7.5 L-103 15.8" fill="none" stroke="#c9ced6" stroke-width="15"/>
  </g>
</svg>
