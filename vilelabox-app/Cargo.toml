[package]
name = "vilelabox-app"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Aplicativo desktop do VILELABOX (Slint)"
publish = false

[dependencies]
vilelabox-anlz = { path = "../vilelabox-anlz" }
slint = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

vilelabox-xml = { path = "../vilelabox-xml" }
vilelabox-catalog = { path = "../vilelabox-catalog" }
vilelabox-audio = { path = "../vilelabox-audio" }

[build-dependencies]
slint-build = "1"


